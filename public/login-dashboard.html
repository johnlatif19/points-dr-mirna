<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الإدارة - نقاط د. ميرنا</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0d5c3e;
            --primary-dark: #0a452e;
            --primary-light: #1a7a55;
            --emerald: #2ecc71;
            --mint-light: #d5f5e3;
            --white: #ffffff;
            --gray-50: #f8faf9;
            --gray-100: #f1f4f2;
            --gray-200: #e8ece9;
            --gray-300: #d1d8d4;
            --gray-600: #6b7a73;
            --gray-800: #2d3a33;
            --gray-900: #1a241e;
            --shadow-md: 0 4px 20px rgba(13, 92, 62, 0.12);
            --shadow-lg: 0 8px 40px rgba(13, 92, 62, 0.16);
            --radius: 12px;
            --radius-lg: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a241e 0%, var(--primary-dark) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-container {
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .auth-logo img {
            height: 48px;
            width: auto;
            border-radius: 8px;
        }

        .auth-logo span {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
        }

        .auth-title {
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 4px;
        }

        .auth-subtitle {
            text-align: center;
            color: var(--gray-600);
            margin-bottom: 32px;
            font-size: 14px;
        }

        .admin-badge {
            display: inline-block;
            background: var(--gray-800);
            color: var(--white);
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: 6px;
            font-size: 14px;
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper i {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-300);
            font-size: 16px;
            transition: var(--transition);
        }

        .form-group input {
            width: 100%;
            padding: 12px 44px 12px 14px;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 15px;
            transition: var(--transition);
            background: var(--gray-50);
            color: var(--gray-900);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(13, 92, 62, 0.1);
            background: var(--white);
        }

        .form-group input.error {
            border-color: #e74c3c;
        }

        .form-group .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 4px;
            display: none;
        }

        .form-group .error-message.visible {
            display: block;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--gray-800);
            color: var(--white);
            border: none;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background: var(--gray-900);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: var(--gray-600);
            font-size: 14px;
        }

        .auth-footer a {
            color: var(--primary);
            font-weight: 600;
            transition: var(--transition);
        }

        .auth-footer a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--gray-900);
            color: var(--white);
            padding: 16px 32px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 90%;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            background: #c0392b;
        }

        .toast.success {
            background: var(--primary);
        }

        .toast i {
            font-size: 20px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: var(--white);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .security-note {
            background: var(--gray-50);
            border-radius: var(--radius);
            padding: 12px 16px;
            margin-top: 16px;
            font-size: 13px;
            color: var(--gray-600);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .security-note i {
            color: var(--primary);
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 32px 20px;
            }

            .auth-title {
                font-size: 22px;
            }

            .auth-logo span {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <!-- ===== إشعار ===== -->
    <div id="toast" class="toast">
        <i class="fas fa-info-circle"></i>
        <span id="toastMessage">الرسالة</span>
    </div>

    <!-- ===== نموذج دخول الأدمن ===== -->
    <div class="auth-container">
        <div class="auth-logo">
            <img src="https://i.postimg.cc/KvNnTfQx/Points-Dr-Mirna.jpg" alt="نقاط د. ميرنا">
            <span>نقاط د. ميرنا</span>
        </div>

        <div style="text-align: center;">
            <span class="admin-badge"><i class="fas fa-user-shield"></i> لوحة الإدارة</span>
        </div>

        <h1 class="auth-title">دخول الإدارة</h1>
        <p class="auth-subtitle">الرجاء إدخال بيانات الاعتماد للوصول إلى لوحة التحكم</p>

        <form id="adminLoginForm" novalidate>
            <div class="form-group">
                <label>اسم المستخدم</label>
                <div class="input-wrapper">
                    <input type="text" id="adminUsername" placeholder="أدخل اسم المستخدم" required>
                    <i class="fas fa-user-cog"></i>
                </div>
                <div class="error-message" id="adminUsernameError">الرجاء إدخال اسم المستخدم</div>
            </div>

            <div class="form-group">
                <label>كلمة المرور</label>
                <div class="input-wrapper">
                    <input type="password" id="adminPassword" placeholder="أدخل كلمة المرور" required>
                    <i class="fas fa-lock"></i>
                </div>
                <div class="error-message" id="adminPasswordError">الرجاء إدخال كلمة المرور</div>
            </div>

            <button type="submit" class="btn-submit" id="adminLoginBtn">
                <i class="fas fa-sign-in-alt"></i>
                <span>دخول لوحة التحكم</span>
            </button>
        </form>

        <div class="security-note">
            <i class="fas fa-shield-alt"></i>
            <span>بيانات الدخول مشفرة ومحمية. يتم التحقق من الصلاحيات على الخادم.</span>
        </div>

        <div class="auth-footer">
            <a href="/">العودة للرئيسية</a>
        </div>
    </div>

    <script>
        // ===== عناصر DOM =====
        const form = document.getElementById('adminLoginForm');
        const username = document.getElementById('adminUsername');
        const password = document.getElementById('adminPassword');
        const submitBtn = document.getElementById('adminLoginBtn');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');

        // ===== دالة عرض الإشعار =====
        function showToast(message, type = 'info') {
            toast.className = 'toast ' + type;
            toastMessage.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 5000);
        }

        // ===== التحقق من الحقول =====
        username.addEventListener('blur', () => {
            const errorEl = document.getElementById('adminUsernameError');
            if (username.value.trim().length === 0) {
                username.classList.add('error');
                errorEl.classList.add('visible');
            } else {
                username.classList.remove('error');
                errorEl.classList.remove('visible');
            }
        });

        password.addEventListener('blur', () => {
            const errorEl = document.getElementById('adminPasswordError');
            if (password.value.length === 0) {
                password.classList.add('error');
                errorEl.classList.add('visible');
            } else {
                password.classList.remove('error');
                errorEl.classList.remove('visible');
            }
        });

        // ===== تقديم النموذج =====
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // التحقق
            let isValid = true;
            const userError = document.getElementById('adminUsernameError');
            const passError = document.getElementById('adminPasswordError');

            if (username.value.trim().length === 0) {
                username.classList.add('error');
                userError.classList.add('visible');
                isValid = false;
            } else {
                username.classList.remove('error');
                userError.classList.remove('visible');
            }

            if (password.value.length === 0) {
                password.classList.add('error');
                passError.classList.add('visible');
                isValid = false;
            } else {
                password.classList.remove('error');
                passError.classList.remove('visible');
            }

            if (!isValid) return;

            // تعطيل الزر
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> جاري التحقق...';

            try {
                // إرسال طلب إلى الخادم
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username.value.trim(),
                        password: password.value
                    }),
                });

                const data = await response.json();

                if (response.ok) {
                    showToast('تم تسجيل الدخول بنجاح، جارٍ التحويل...', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1000);
                } else {
                    showToast(data.error || 'بيانات الدخول غير صحيحة', 'error');
                }
            } catch (error) {
                console.error('Admin login error:', error);
                showToast('حدث خطأ في الاتصال بالخادم', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> دخول لوحة التحكم';
            }
        });

        // ===== التحقق من وجود جلسة نشطة =====
        async function checkAdminSession() {
            try {
                const response = await fetch('/api/admin/me', {
                    method: 'GET',
                    credentials: 'include',
                });

                if (response.ok) {
                    // إذا كانت الجلسة نشطة، انتقل مباشرة إلى لوحة التحكم
                    window.location.href = '/dashboard';
                }
            } catch (error) {
                // لا يوجد جلسة نشطة، ابق في صفحة الدخول
                console.log('No active admin session');
            }
        }

        // التحقق عند التحميل
        checkAdminSession();
    </script>
</body>
</html>
