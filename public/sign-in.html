<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - نقاط د. ميرنا</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0d5c3e;
            --primary-dark: #0a452e;
            --primary-light: #1a7a55;
            --emerald: #2ecc71;
            --mint-light: #d5f5e3;
            --white: #ffffff;
            --gray-50: #f8faf9;
            --gray-100: #f1f4f2;
            --gray-200: #e8ece9;
            --gray-300: #d1d8d4;
            --gray-600: #6b7a73;
            --gray-800: #2d3a33;
            --gray-900: #1a241e;
            --shadow-md: 0 4px 20px rgba(13, 92, 62, 0.12);
            --shadow-lg: 0 8px 40px rgba(13, 92, 62, 0.16);
            --radius: 12px;
            --radius-lg: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--mint-light) 0%, var(--white) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-container {
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .auth-logo img {
            height: 48px;
            width: auto;
            border-radius: 8px;
        }

        .auth-logo span {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
        }

        .auth-title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 8px;
        }

        .auth-subtitle {
            text-align: center;
            color: var(--gray-600);
            margin-bottom: 32px;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: 6px;
            font-size: 14px;
        }

        .form-group label .required {
            color: #e74c3c;
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper i {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-300);
            font-size: 16px;
            transition: var(--transition);
        }

        .form-group input {
            width: 100%;
            padding: 12px 44px 12px 14px;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 15px;
            transition: var(--transition);
            background: var(--gray-50);
            color: var(--gray-900);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(13, 92, 62, 0.1);
            background: var(--white);
        }

        .form-group input:focus + i {
            color: var(--primary);
        }

        .form-group input.error {
            border-color: #e74c3c;
        }

        .form-group .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 4px;
            display: none;
        }

        .form-group .error-message.visible {
            display: block;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: var(--gray-600);
            font-size: 14px;
        }

        .auth-footer a {
            color: var(--primary);
            font-weight: 600;
            transition: var(--transition);
        }

        .auth-footer a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--gray-900);
            color: var(--white);
            padding: 16px 32px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 90%;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            background: #c0392b;
        }

        .toast.success {
            background: var(--primary);
        }

        .toast i {
            font-size: 20px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: var(--white);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 32px 20px;
            }

            .auth-title {
                font-size: 24px;
            }

            .auth-logo span {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div id="toast" class="toast">
        <i class="fas fa-info-circle"></i>
        <span id="toastMessage">الرسالة</span>
    </div>

    <div class="auth-container">
        <div class="auth-logo">
            <img src="https://i.postimg.cc/KvNnTfQx/Points-Dr-Mirna.jpg" alt="نقاط د. ميرنا">
            <span>نقاط د. ميرنا</span>
        </div>

        <h1 class="auth-title">إنشاء حساب</h1>
        <p class="auth-subtitle">سجل الآن للاستفادة من نقاط الولاء</p>

        <form id="signupForm" novalidate>
            <div class="form-group">
                <label>الاسم الكامل <span class="required">*</span></label>
                <div class="input-wrapper">
                    <input type="text" id="fullName" placeholder="أدخل الاسم الكامل" required>
                    <i class="fas fa-user"></i>
                </div>
                <div class="error-message" id="fullNameError">الرجاء إدخال الاسم الكامل</div>
            </div>

            <div class="form-group">
                <label>رقم الهاتف <span class="required">*</span></label>
                <div class="input-wrapper">
                    <input type="tel" id="phone" placeholder="أدخل رقم الهاتف" required>
                    <i class="fas fa-phone"></i>
                </div>
                <div class="error-message" id="phoneError">الرجاء إدخال رقم الهاتف</div>
            </div>

            <div class="form-group">
                <label>البريد الإلكتروني <span class="required">*</span></label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="example@email.com" required>
                    <i class="fas fa-envelope"></i>
                </div>
                <div class="error-message" id="emailError">الرجاء إدخال بريد إلكتروني صحيح</div>
            </div>

            <div class="form-group">
                <label>كلمة المرور <span class="required">*</span></label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required minlength="6">
                    <i class="fas fa-lock"></i>
                </div>
                <div class="error-message" id="passwordError">كلمة المرور يجب أن تكون 6 أحرف على الأقل</div>
            </div>

            <div class="form-group">
                <label>تأكيد كلمة المرور <span class="required">*</span></label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" placeholder="أعد إدخال كلمة المرور" required>
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="error-message" id="confirmPasswordError">كلمة المرور غير متطابقة</div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fas fa-user-plus"></i>
                <span>إنشاء الحساب</span>
            </button>
        </form>

        <div class="auth-footer">
            لديك حساب بالفعل؟ <a href="/login.html">تسجيل الدخول</a>
            <br>
            <a href="/">العودة للرئيسية</a>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

    <script>
        // ===== تهيئة Firebase =====
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyPleaseReplaceWithYourOwn",
            authDomain: "your-project.firebaseapp.com",
            projectId: "your-project",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ===== عناصر DOM =====
        const form = document.getElementById('signupForm');
        const fullName = document.getElementById('fullName');
        const phone = document.getElementById('phone');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const submitBtn = document.getElementById('submitBtn');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');

        // ===== دالة عرض الإشعار =====
        function showToast(message, type = 'info') {
            toast.className = 'toast ' + type;
            toastMessage.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 5000);
        }

        // ===== التحقق من الحقول =====
        function validateField(input, errorId, condition) {
            const errorEl = document.getElementById(errorId);
            if (!condition) {
                input.classList.add('error');
                errorEl.classList.add('visible');
                return false;
            } else {
                input.classList.remove('error');
                errorEl.classList.remove('visible');
                return true;
            }
        }

        // ===== التحقق المباشر =====
        fullName.addEventListener('blur', () => {
            validateField(fullName, 'fullNameError', fullName.value.trim().length >= 2);
        });

        phone.addEventListener('blur', () => {
            validateField(phone, 'phoneError', phone.value.trim().length >= 8);
        });

        email.addEventListener('blur', () => {
            const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
            validateField(email, 'emailError', isValid);
        });

        password.addEventListener('blur', () => {
            validateField(password, 'passwordError', password.value.length >= 6);
        });

        confirmPassword.addEventListener('blur', () => {
            validateField(confirmPassword, 'confirmPasswordError', 
                confirmPassword.value === password.value && confirmPassword.value.length > 0);
        });

        // ===== تقديم النموذج =====
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // التحقق من جميع الحقول
            const isNameValid = validateField(fullName, 'fullNameError', fullName.value.trim().length >= 2);
            const isPhoneValid = validateField(phone, 'phoneError', phone.value.trim().length >= 8);
            const isEmailValid = validateField(email, 'emailError', /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim()));
            const isPasswordValid = validateField(password, 'passwordError', password.value.length >= 6);
            const isConfirmValid = validateField(confirmPassword, 'confirmPasswordError', 
                confirmPassword.value === password.value && confirmPassword.value.length > 0);

            if (!isNameValid || !isPhoneValid || !isEmailValid || !isPasswordValid || !isConfirmValid) {
                showToast('الرجاء تصحيح الأخطاء في النموذج', 'error');
                return;
            }

            // تعطيل الزر
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> جاري إنشاء الحساب...';

            try {
                // 1. إنشاء حساب في Firebase Authentication
                const userCredential = await auth.createUserWithEmailAndPassword(
                    email.value.trim(),
                    password.value
                );

                const uid = userCredential.user.uid;

                // 2. تحديث الملف الشخصي
                await userCredential.user.updateProfile({
                    displayName: fullName.value.trim()
                });

                // 3. إنشاء وثيقة المستخدم في Firestore
                const now = firebase.firestore.FieldValue.serverTimestamp();
                await db.collection('users').doc(uid).set({
                    name: fullName.value.trim(),
                    phone: phone.value.trim(),
                    email: email.value.trim(),
                    points: 0,
                    role: 'patient',
                    status: 'active',
                    firebaseUid: uid,
                    createdAt: now,
                    updatedAt: now
                });

                // 4. إنشاء سجل ترحيبي
                await db.collection('transactions').add({
                    userId: uid,
                    type: 'signup',
                    points: 0,
                    previousBalance: 0,
                    newBalance: 0,
                    reason: 'مرحباً بك في نقاط د. ميرنا',
                    performedBy: 'system',
                    createdAt: now
                });

                showToast('تم إنشاء الحساب بنجاح! جارٍ التحويل...', 'success');
                
                // 5. تسجيل الخروج وتوجيه المستخدم
                setTimeout(() => {
                    auth.signOut();
                    window.location.href = '/login.html';
                }, 1500);

            } catch (error) {
                console.error('Signup error:', error);
                let message = 'حدث خطأ أثناء إنشاء الحساب';
                
                switch (error.code) {
                    case 'auth/email-already-in-use':
                        message = 'البريد الإلكتروني مستخدم بالفعل';
                        break;
                    case 'auth/invalid-email':
                        message = 'البريد الإلكتروني غير صحيح';
                        break;
                    case 'auth/weak-password':
                        message = 'كلمة المرور ضعيفة جداً';
                        break;
                    case 'auth/network-request-failed':
                        message = 'خطأ في الاتصال بالشبكة، تأكد من اتصالك بالإنترنت';
                        break;
                    default:
                        message = error.message || 'حدث خطأ غير متوقع';
                }
                
                showToast(message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> إنشاء الحساب';
            }
        });
    </script>
</body>
</html>
